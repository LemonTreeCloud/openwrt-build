#
# Description: Build OpenWrt using GitHub Actions
#

name: build-immortalwrt-25.12

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FILES: immortalwrt-25.12/files
  FEEDS_CONF: immortalwrt-25.12/feeds.conf.default
  CONFIG_FILE: immortalwrt-25.12/.config
  DIY_P1_SH: immortalwrt-25.12/diy-part1.sh
  DIY_P2_SH: immortalwrt-25.12/diy-part2.sh
  R2_BUCKET: openwrt-firmware
  R2_PATH: firmware/immortalwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Show system
      run: |
        echo -e "\n\e[1;32mCPU:\e[0m"
        echo "$(grep 'model name' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}') ($(grep 'cpu MHz' /proc/cpuinfo | head -1 | awk -F ': ' '{print $2}')MHz) x $(grep processor /proc/cpuinfo  | wc -l)"
        echo -e "\n\e[1;32mMemory:\e[0m"
        free -h
        echo -e "\n\e[1;32mStorage:\e[0m"
        df -Th / /mnt
        echo -e "\n\e[1;32mSystem:\e[0m"
        lsb_release -a
        echo -e "\n\e[1;32mKernel:\e[0m"
        uname -a
        echo

    - name: Free disk space
      uses: LemonTreeCloud/sbwml-actions@free-disk

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        repository: LemonTreeCloud/openwrt-code
        token: ${{ secrets.BUILD_REPO_TOKEN }}

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      env:
        BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}
      run: |
        [ -e $FILES ] && mv $FILES openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
    
        DATE=$(date +%y.%m.%d)
    
        for f in immortalwrt-*.img.gz; do
          [ -e "$f" ] || continue
          mv "$f" "${f/immortalwrt/immortalwrt-$DATE}"
        done
    
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to R2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      run: |
        ARCHIVE_NAME="firmware_$(date +%Y%m%d%H%M%S).tar.gz"
        tar -czf "/tmp/$ARCHIVE_NAME" -C "$FIRMWARE" .
        echo "Uploading $ARCHIVE_NAME to R2..."
        aws s3 cp "/tmp/$ARCHIVE_NAME" "s3://$R2_BUCKET/$R2_PATH/$ARCHIVE_NAME" \
          --endpoint-url "$R2_ENDPOINT"
        echo "Upload complete. Cleaning old archives..."
        ALL_KEYS=$(aws s3api list-objects-v2 \
          --bucket "$R2_BUCKET" \
          --prefix "$R2_PATH/" \
          --query 'Contents | sort_by(@, &LastModified) | [].Key' \
          --output text \
          --endpoint-url "$R2_ENDPOINT")
        TOTAL=$(echo "$ALL_KEYS" | wc -w)
        KEEP=3
        if [ "$TOTAL" -gt "$KEEP" ]; then
          DELETE_COUNT=$((TOTAL - KEEP))
          DELETE_KEYS=$(echo "$ALL_KEYS" | tr '\t' '\n' | head -n "$DELETE_COUNT")
          for key in $DELETE_KEYS; do
            echo "Deleting old archive: $key"
            aws s3api delete-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT"
          done
          echo "Deleted $DELETE_COUNT old archive(s)."
        else
          echo "Total archives ($TOTAL) <= $KEEP, nothing to delete."
        fi

        # Generate presigned URL (valid for 7 days = 604800 seconds)
        echo "Generating presigned download URL..."
        PRESIGNED_URL=$(aws s3 presign \
          "s3://$R2_BUCKET/$R2_PATH/$ARCHIVE_NAME" \
          --expires-in 604800 \
          --endpoint-url "$R2_ENDPOINT")
        # Mask the URL to prevent it from appearing in logs
        echo "::add-mask::${PRESIGNED_URL}"
        echo "PRESIGNED_URL=${PRESIGNED_URL}" >> $GITHUB_ENV
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
        echo "Presigned URL generated (valid for 7 days)."

    - name: Telegram notification
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ steps.compile.outputs.status }}" == "success" ]; then
          STATUS="✅ <b>编译成功</b>"
          DOWNLOAD_SECTION="
        ━━━━━━━━━━━━━━━━━━
        📥 <b>固件下载</b>
        ├ 文件: <code>${ARCHIVE_NAME}</code>
        └ <a href='${PRESIGNED_URL}'>⬇️ 点击下载</a> (7天有效)"
        else
          STATUS="❌ <b>编译失败</b>"
          DOWNLOAD_SECTION=""
        fi

        MESSAGE="${STATUS}
        ━━━━━━━━━━━━━━━━━━
        📋 <b>构建信息</b>
        ├ 项目: <code>${{ github.repository }}</code>
        ├ 分支: <code>${REPO_BRANCH}</code>
        ├ 工作流: <code>${{ github.workflow }}</code>
        └ 时间: <code>$(date +'%Y-%m-%d %H:%M:%S')</code>
        ${DOWNLOAD_SECTION}
        ━━━━━━━━━━━━━━━━━━
        🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>查看构建详情</a>"

        # Remove leading whitespace from heredoc-style indentation
        MESSAGE=$(echo "$MESSAGE" | sed 's/^        //g')

        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${MESSAGE}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_web_page_preview=true")
        echo "Telegram API response code: ${HTTP_CODE}"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::warning::Telegram notification failed with HTTP ${HTTP_CODE}"
        fi
